name: CI

on:
  push:
    branches: [main, master, develop, 'feature/*', 'release/*']
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 - GCC 13
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            build_type: Debug
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            build_type: Release
          # Ubuntu 24.04 - GCC 14
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            build_type: Debug
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            build_type: Release
          # Ubuntu 24.04 - Clang 18
          - os: ubuntu-24.04
            compiler: clang-18
            cc: clang-18
            cxx: clang++-18
            build_type: Debug
          - os: ubuntu-24.04
            compiler: clang-18
            cc: clang-18
            cxx: clang++-18
            build_type: Release
          # macOS 14 - LLVM Clang 18 (Apple Clang doesn't support C++23)
          - os: macos-14
            compiler: llvm-18
            cc: llvm-clang
            cxx: llvm-clang++
            build_type: Debug
          - os: macos-14
            compiler: llvm-18
            cc: llvm-clang
            cxx: llvm-clang++
            build_type: Release
          # Windows - MSVC 2022
          - os: windows-2022
            compiler: msvc
            cc: cl
            cxx: cl
            build_type: Debug
          - os: windows-2022
            compiler: msvc
            cc: cl
            cxx: cl
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

          # Install GCC if needed
          if [[ "${{ matrix.cc }}" == gcc-* ]]; then
            sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
            sudo apt-get update
            sudo apt-get install -y ${{ matrix.cc }} ${{ matrix.cxx }}
          fi

          # Install Clang if needed
          if [[ "${{ matrix.cc }}" == clang-* ]]; then
            wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-18 main" | sudo tee /etc/apt/sources.list.d/llvm-18.list
            sudo apt-get update
            sudo apt-get install -y clang-18
          fi

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew update
          brew install ninja cmake llvm@18

      - name: Install dependencies (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          choco install ninja -y

      - name: Setup MSVC (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_STANDARD=23 \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON

      - name: Configure (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          # Use LLVM Clang for C++23 support
          export CC="$(brew --prefix llvm@18)/bin/clang"
          export CXX="$(brew --prefix llvm@18)/bin/clang++"

          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_STANDARD=23 \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON

      - name: Configure (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_CXX_STANDARD=23 `
            -DBUILD_TESTS=ON `
            -DBUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Install
        run: cmake --install build --prefix install

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DIPAL-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: install/
          retention-days: 7
