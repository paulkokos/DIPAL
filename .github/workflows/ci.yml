name: CI

on:
  push:
    branches: [main, master, develop, 'feature/*', 'release/*']
    tags:
      - 'v*'
  pull_request:
    branches: [main, master, develop]

jobs:
  # ===================
  # Checksums for Package Managers (releases only)
  # ===================
  checksums:
    name: Generate Package Checksums
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Calculate checksums
        run: |
          echo "======================================"
          echo "CHECKSUMS FOR PACKAGE MANAGERS"
          echo "======================================"
          echo ""
          curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz" -o source.tar.gz
          echo "Version: ${{ github.ref_name }}"
          echo ""
          echo "--- SHA256 (Homebrew, AUR) ---"
          sha256sum source.tar.gz | cut -d' ' -f1
          echo ""
          echo "--- SHA512 (vcpkg) ---"
          sha512sum source.tar.gz | cut -d' ' -f1
          echo ""
          echo "======================================"

  build:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ===================
          # Ubuntu 22.04 (LTS)
          # Note: Only GCC 13 - Clang uses system libstdc++ (GCC 12) which lacks <format>
          # ===================
          - os: ubuntu-22.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            build_type: Release

          # ===================
          # Ubuntu 24.04 (Latest LTS)
          # ===================
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            build_type: Debug
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            build_type: Release
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            build_type: Debug
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            build_type: Release
          - os: ubuntu-24.04
            compiler: clang-18
            cc: clang-18
            cxx: clang++-18
            build_type: Debug
          - os: ubuntu-24.04
            compiler: clang-18
            cc: clang-18
            cxx: clang++-18
            build_type: Release
          - os: ubuntu-24.04
            compiler: clang-19
            cc: clang-19
            cxx: clang++-19
            build_type: Release

          # ===================
          # macOS 14 (Sonoma)
          # ===================
          - os: macos-14
            compiler: llvm-18
            build_type: Debug
          - os: macos-14
            compiler: llvm-18
            build_type: Release

          # ===================
          # macOS 15 (Sequoia - Latest)
          # ===================
          - os: macos-15
            compiler: llvm-18
            build_type: Debug
          - os: macos-15
            compiler: llvm-18
            build_type: Release

          # ===================
          # Windows Server 2022 (~Windows 11)
          # Note: Windows 2019/MSVC 2019 not supported - lacks C++23 std::expected
          # ===================
          - os: windows-2022
            compiler: msvc
            build_type: Debug
          - os: windows-2022
            compiler: msvc
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ===================
      # Ubuntu Setup
      # ===================
      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

          # Install GCC if needed
          if [[ "${{ matrix.cc }}" == gcc-* ]]; then
            sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
            sudo apt-get update
            sudo apt-get install -y ${{ matrix.cc }} ${{ matrix.cxx }}
          fi

          # Install Clang if needed
          if [[ "${{ matrix.cc }}" == clang-* ]]; then
            wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
            CODENAME=$(lsb_release -cs)
            CLANG_VERSION="${{ matrix.cc }}"
            CLANG_VERSION="${CLANG_VERSION#clang-}"
            echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${CLANG_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
            sudo apt-get update
            sudo apt-get install -y clang-${CLANG_VERSION}
          fi

      - name: Configure (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_STANDARD=23 \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON

      # ===================
      # macOS Setup
      # ===================
      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew update
          brew install ninja cmake llvm@18 2>/dev/null || true

      - name: Configure (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          export CC="$(brew --prefix llvm@18)/bin/clang"
          export CXX="$(brew --prefix llvm@18)/bin/clang++"

          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_STANDARD=23 \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON

      # ===================
      # Windows Setup
      # ===================
      - name: Install dependencies (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          choco install ninja -y

      - name: Setup MSVC (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_CXX_STANDARD=23 `
            -DBUILD_TESTS=ON `
            -DBUILD_EXAMPLES=ON

      # ===================
      # Build, Test, Install
      # ===================
      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Install
        run: cmake --install build --prefix install

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DIPAL-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: install/
          retention-days: 7

      # ===================
      # Release Packaging
      # ===================
      - name: Package for Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd install
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a ../DIPAL-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}.zip .
          else
            tar -czvf ../DIPAL-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}.tar.gz .
          fi
        shell: bash

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            DIPAL-*.zip
            DIPAL-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
