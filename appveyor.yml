version: 0.1.{build}

# Specify which branches to build
branches:
  only:
    - main
    - master
    - develop
    - feature/*
    - release/*

# Do not build on tags
skip_tags: true

# Build matrix - C++23 compatible compilers only
environment:
  matrix:
    # Windows - Visual Studio 2022 (MSVC 19.34+ with C++23 support)
    - APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
      BUILD_TYPE: Debug
      BUILD_TESTS: ON
      BUILD_EXAMPLES: ON
      PLATFORM: windows
    - APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
      BUILD_TYPE: Release
      BUILD_TESTS: ON
      BUILD_EXAMPLES: ON
      PLATFORM: windows
    # Ubuntu 22.04 - GCC 13 (C++23 support)
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
      CC: gcc-13
      CXX: g++-13
      BUILD_TYPE: Debug
      BUILD_TESTS: ON
      BUILD_EXAMPLES: ON
      PLATFORM: linux
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
      CC: gcc-13
      CXX: g++-13
      BUILD_TYPE: Release
      BUILD_TESTS: ON
      BUILD_EXAMPLES: ON
      PLATFORM: linux
    # Ubuntu 22.04 - Clang 18 (C++23 support)
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
      CC: clang-18
      CXX: clang++-18
      BUILD_TYPE: Debug
      BUILD_TESTS: ON
      BUILD_EXAMPLES: ON
      PLATFORM: linux
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
      CC: clang-18
      CXX: clang++-18
      BUILD_TYPE: Release
      BUILD_TESTS: ON
      BUILD_EXAMPLES: ON
      PLATFORM: linux
    # macOS builds (Apple Clang has C++23 support)
    - APPVEYOR_BUILD_WORKER_IMAGE: macos-monterey
      CC: clang
      CXX: clang++
      BUILD_TYPE: Release
      BUILD_TESTS: ON
      BUILD_EXAMPLES: ON
      PLATFORM: macos
    - APPVEYOR_BUILD_WORKER_IMAGE: macos-ventura
      CC: clang
      CXX: clang++
      BUILD_TYPE: Release
      BUILD_TESTS: ON
      BUILD_EXAMPLES: ON
      PLATFORM: macos

# Install dependencies
install:
  # Windows-specific setup
  - cmd: |
      if "%PLATFORM%"=="windows" (
        choco install ninja -y
        cmake --version
      )

  # Initialize git submodules (Unix)
  - sh: |
      if [ -f .gitmodules ]; then
        git submodule update --init --recursive
      fi

  # Initialize git submodules (Windows)
  - cmd: |
      if exist .gitmodules (
        git submodule update --init --recursive
      )

  # Linux-specific setup
  - sh: |
      if [[ "${APPVEYOR_BUILD_WORKER_IMAGE}" == Ubuntu* ]]; then
        sudo apt-get update
        sudo apt-get install -y ninja-build ca-certificates gpg wget

        # Install CMake from Kitware repository (need 3.24+)
        wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
        echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main' | sudo tee /etc/apt/sources.list.d/kitware.list >/dev/null
        sudo apt-get update
        sudo apt-get install -y cmake

        # Install GCC compilers
        if [[ "${CC}" == gcc-* ]]; then
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y ${CC} ${CXX}
        fi

        # Install Clang compilers
        if [[ "${CC}" == clang-* ]]; then
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" -y
          sudo apt-get update
          CLANG_VERSION="${CC#clang-}"
          sudo apt-get install -y clang-${CLANG_VERSION}
        fi

        # Verify installations
        cmake --version
        ${CC} --version
        ${CXX} --version
      fi

  # macOS-specific setup
  - sh: |
      if [[ "${APPVEYOR_BUILD_WORKER_IMAGE}" == macos-* ]]; then
        brew update
        brew install ninja cmake

        # Verify compiler
        ${CC} --version
        ${CXX} --version
      fi

# Configure the build
before_build:
  # Windows configuration (using Visual Studio generator for MSVC)
  - cmd: |
      if "%PLATFORM%"=="windows" (
        call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
        mkdir build
        cd build
        cmake -G "Ninja" -DCMAKE_BUILD_TYPE=%BUILD_TYPE% -DCMAKE_CXX_STANDARD=23 -DBUILD_TESTS=%BUILD_TESTS% -DBUILD_EXAMPLES=%BUILD_EXAMPLES% ..
      )

  # Unix configuration
  - sh: |
      if [[ "${PLATFORM}" != "windows" ]]; then
        export CC=${CC}
        export CXX=${CXX}
        mkdir -p build
        cd build
        cmake -G "Ninja" \
          -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
          -DCMAKE_CXX_STANDARD=23 \
          -DBUILD_TESTS=${BUILD_TESTS} \
          -DBUILD_EXAMPLES=${BUILD_EXAMPLES} \
          ..
      fi

# Build the project
build_script:
  # Windows build
  - cmd: |
      if "%PLATFORM%"=="windows" (
        call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
        cd build
        cmake --build . --config %BUILD_TYPE%
      )

  # Unix build
  - sh: |
      if [[ "${PLATFORM}" != "windows" ]]; then
        cd build
        cmake --build . --config ${BUILD_TYPE}
      fi

# Run the tests
test_script:
  # Windows tests
  - cmd: |
      if "%PLATFORM%"=="windows" if "%BUILD_TESTS%"=="ON" (
        cd build
        ctest --output-on-failure -C %BUILD_TYPE%
      )

  # Unix tests
  - sh: |
      if [[ "${PLATFORM}" != "windows" ]] && [[ "${BUILD_TESTS}" == "ON" ]]; then
        cd build
        ctest --output-on-failure
      fi

# Package artifacts
after_build:
  # Windows packaging
  - cmd: |
      if "%PLATFORM%"=="windows" (
        cd build
        cmake --install . --prefix ../install --config %BUILD_TYPE%
        cd ..
        7z a DIPAL-%BUILD_TYPE%-msvc-windows.zip ./install/*
      )

  # Unix packaging
  - sh: |
      if [[ "${PLATFORM}" != "windows" ]]; then
        cd build
        cmake --install . --prefix ../install --config ${BUILD_TYPE}
        cd ..
        if [[ "${APPVEYOR_BUILD_WORKER_IMAGE}" == Ubuntu* ]]; then
          tar -czf DIPAL-${BUILD_TYPE}-${CC}-linux.tar.gz ./install/*
        elif [[ "${APPVEYOR_BUILD_WORKER_IMAGE}" == macos-* ]]; then
          tar -czf DIPAL-${BUILD_TYPE}-${CC}-macos.tar.gz ./install/*
        fi
      fi

# Define artifacts
artifacts:
  - path: '*.tar.gz'
    name: Unix-Artifacts
  - path: '*.zip'
    name: Windows-Artifacts
