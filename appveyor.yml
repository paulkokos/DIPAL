version: 0.1.{build}

# Specify which branches to build
branches:
  only:
    - main
    - master
    - develop
    - feature/*
    - release/*

# Do not build on tags
skip_tags: true

# Build matrix - C++23 compatible compilers only
environment:
  matrix:
    # Ubuntu 22.04 - GCC 13 (C++23 support)
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
      CC: gcc-13
      CXX: g++-13
      BUILD_TYPE: Debug
      BUILD_TESTS: ON
      BUILD_EXAMPLES: ON
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
      CC: gcc-13
      CXX: g++-13
      BUILD_TYPE: Release
      BUILD_TESTS: ON
      BUILD_EXAMPLES: ON
    # Ubuntu 22.04 - Clang 17 (C++23 support)
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
      CC: clang-17
      CXX: clang++-17
      BUILD_TYPE: Debug
      BUILD_TESTS: ON
      BUILD_EXAMPLES: ON
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
      CC: clang-17
      CXX: clang++-17
      BUILD_TYPE: Release
      BUILD_TESTS: ON
      BUILD_EXAMPLES: ON
    # macOS builds (Apple Clang has C++23 support)
    - APPVEYOR_BUILD_WORKER_IMAGE: macos-monterey
      CC: clang
      CXX: clang++
      BUILD_TYPE: Release
      BUILD_TESTS: ON
      BUILD_EXAMPLES: ON
    - APPVEYOR_BUILD_WORKER_IMAGE: macos-ventura
      CC: clang
      CXX: clang++
      BUILD_TYPE: Release
      BUILD_TESTS: ON
      BUILD_EXAMPLES: ON

# Install dependencies
install:
  # Initialize git submodules
  - sh: |
      if [ -f .gitmodules ]; then
        git submodule update --init --recursive
      fi

  # Linux-specific setup
  - sh: |
      if [[ "${APPVEYOR_BUILD_WORKER_IMAGE}" == Ubuntu* ]]; then
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake

        # Install GCC compilers
        if [[ "${CC}" == gcc-* ]]; then
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y ${CC} ${CXX}
        fi

        # Install Clang compilers
        if [[ "${CC}" == clang-* ]]; then
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" -y
          sudo apt-get update
          CLANG_VERSION="${CC#clang-}"
          sudo apt-get install -y clang-${CLANG_VERSION}
        fi

        # Verify compiler installation
        ${CC} --version
        ${CXX} --version
      fi

  # macOS-specific setup
  - sh: |
      if [[ "${APPVEYOR_BUILD_WORKER_IMAGE}" == macos-* ]]; then
        brew update
        brew install ninja cmake

        # Verify compiler
        ${CC} --version
        ${CXX} --version
      fi

# Configure the build
before_build:
  - sh: |
      export CC=${CC}
      export CXX=${CXX}
      mkdir -p build
      cd build
      cmake -G "Ninja" \
        -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
        -DCMAKE_CXX_STANDARD=23 \
        -DBUILD_TESTS=${BUILD_TESTS} \
        -DBUILD_EXAMPLES=${BUILD_EXAMPLES} \
        ..

# Build the project
build_script:
  - sh: |
      cd build
      cmake --build . --config ${BUILD_TYPE}

# Run the tests
test_script:
  - sh: |
      if [[ "${BUILD_TESTS}" == "ON" ]]; then
        cd build
        ctest --output-on-failure
      fi

# Package artifacts
after_build:
  - sh: |
      cd build
      cmake --install . --prefix ../install --config ${BUILD_TYPE}
      cd ..
      if [[ "${APPVEYOR_BUILD_WORKER_IMAGE}" == Ubuntu* ]]; then
        tar -czf DIPAL-${BUILD_TYPE}-${CC}-linux.tar.gz ./install/*
      elif [[ "${APPVEYOR_BUILD_WORKER_IMAGE}" == macos-* ]]; then
        tar -czf DIPAL-${BUILD_TYPE}-${CC}-macos.tar.gz ./install/*
      fi

# Define artifacts
artifacts:
  - path: '*.tar.gz'
    name: Cross-Platform-Artifacts
