# Template for macOS build steps
parameters:
- name: osVersion
  type: string

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'
    addToPath: true
  displayName: 'Use Python 3.11'
    
- script: |
    # Update Homebrew and install basic dependencies
    brew update
    brew install ninja cmake

    # Install LLVM Clang for C++23 support (Apple Clang doesn't support -std=c++23)
    brew install llvm@18

    # Verify LLVM installation
    /opt/homebrew/opt/llvm@18/bin/clang++ --version || /usr/local/opt/llvm@18/bin/clang++ --version

  displayName: 'Install Build Dependencies (${{ parameters.osVersion }})'
  
- script: |
    # Initialize git submodules if any exist
    if [ -f .gitmodules ]; then
      git submodule update --init --recursive
    fi
  displayName: 'Initialize Git Submodules'
  
- script: |
    # Find LLVM path (different on Intel vs ARM Macs)
    if [ -d "/opt/homebrew/opt/llvm@18" ]; then
      LLVM_PATH="/opt/homebrew/opt/llvm@18"
    else
      LLVM_PATH="/usr/local/opt/llvm@18"
    fi

    export CC="${LLVM_PATH}/bin/clang"
    export CXX="${LLVM_PATH}/bin/clang++"

    mkdir -p build
    cd build
    cmake -G "Ninja" \
      -DCMAKE_C_COMPILER=${CC} \
      -DCMAKE_CXX_COMPILER=${CXX} \
      -DCMAKE_BUILD_TYPE=$(BUILD_TYPE) \
      -DBUILD_TESTS=$(BUILD_TESTS) \
      -DBUILD_EXAMPLES=$(BUILD_EXAMPLES) \
      -DENABLE_SANITIZERS=$(ENABLE_SANITIZERS) \
      -DCMAKE_INSTALL_PREFIX=$(Build.ArtifactStagingDirectory) \
      ..
  displayName: 'Configure CMake'
  
- script: |
    cd build
    cmake --build . --parallel $(sysctl -n hw.ncpu)
  displayName: 'Build Project'
  
- script: |
    cd build
    ctest -T Test --output-on-failure --parallel $(sysctl -n hw.ncpu) || true
  displayName: 'Run Tests'
  condition: eq(variables['BUILD_TESTS'], 'ON')
  
- script: |
    cd build
    cmake --install . --config $(BUILD_TYPE)
  displayName: 'Install Project'
  
- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'CTest'
    testResultsFiles: 'build/Testing/**/Test.xml'
    testRunTitle: 'CTest Results - ${{ parameters.osVersion }} - LLVM18 $(BUILD_TYPE)'
  displayName: 'Publish Test Results'
  condition: eq(variables['BUILD_TESTS'], 'ON')

- task: PublishBuildArtifacts@1
  inputs:
    pathtoPublish: '$(Build.ArtifactStagingDirectory)'
    artifactName: 'DIPAL-${{ parameters.osVersion }}-LLVM18-$(BUILD_TYPE)'
  displayName: 'Publish Build Artifacts'
