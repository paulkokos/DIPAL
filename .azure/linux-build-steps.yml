# Template for Linux build steps
parameters:
- name: osVersion
  type: string

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'
    addToPath: true
  displayName: 'Use Python 3.11'

- script: |
    sudo apt-get update
    sudo apt-get install -y ninja-build

    # Install GCC compilers
    if [[ "${CC}" == gcc-* ]]; then
      if [[ "${CC}" == "gcc-13" ]] || [[ "${CC}" == "gcc-14" ]]; then
        # Add toolchain repository for newer GCC versions
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
        sudo apt-get update
      fi
      sudo apt-get install -y ${CC} ${CXX}
    fi

    # Install Clang compilers
    if [[ "${CC}" == clang-* ]]; then
      # Add LLVM repository for newer Clang versions (using signed-by method)
      wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg

      # Determine Ubuntu codename and add appropriate repositories
      if [[ "${{ parameters.osVersion }}" == "ubuntu-22.04" ]]; then
        echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" | sudo tee /etc/apt/sources.list.d/llvm-17.list
        echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm-18.list
      elif [[ "${{ parameters.osVersion }}" == "ubuntu-24.04" ]]; then
        echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-17 main" | sudo tee /etc/apt/sources.list.d/llvm-17.list
        echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-18 main" | sudo tee /etc/apt/sources.list.d/llvm-18.list
        echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm-19.list
      fi

      sudo apt-get update

      # Extract version number from CC (e.g., clang-17 -> 17)
      CLANG_VERSION="${CC#clang-}"

      # Install full clang package (includes clang++)
      sudo apt-get install -y clang-${CLANG_VERSION}
    fi

    # Verify compiler installation
    ${CC} --version
    ${CXX} --version

  displayName: 'Install Build Dependencies (${{ parameters.osVersion }})'
  
- script: |
    # Initialize git submodules if any exist
    if [ -f .gitmodules ]; then
      git submodule update --init --recursive
    fi
  displayName: 'Initialize Git Submodules'
  
- script: |
    mkdir -p build
    cd build
    cmake -G "Ninja" \
      -DCMAKE_BUILD_TYPE=$(BUILD_TYPE) \
      -DBUILD_TESTS=$(BUILD_TESTS) \
      -DBUILD_EXAMPLES=$(BUILD_EXAMPLES) \
      -DENABLE_SANITIZERS=$(ENABLE_SANITIZERS) \
      -DCMAKE_INSTALL_PREFIX=$(Build.ArtifactStagingDirectory) \
      ..
  displayName: 'Configure CMake'
  env:
    CC: $(CC)
    CXX: $(CXX)
  
- script: |
    cd build
    cmake --build . --parallel $(nproc)
  displayName: 'Build Project'
  
- script: |
    cd build
    ctest --output-on-failure --parallel $(nproc)
  displayName: 'Run Tests'
  condition: eq(variables['BUILD_TESTS'], 'ON')
  
- script: |
    cd build
    cmake --install . --config $(BUILD_TYPE)
  displayName: 'Install Project'
  
- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'CTest'
    testResultsFiles: 'build/Testing/**/Test.xml'
    testRunTitle: 'CTest Results - ${{ parameters.osVersion }} - $(CC) $(BUILD_TYPE)'
  displayName: 'Publish Test Results'
  condition: eq(variables['BUILD_TESTS'], 'ON')
  
- task: PublishBuildArtifacts@1
  inputs:
    pathtoPublish: '$(Build.ArtifactStagingDirectory)'
    artifactName: 'DIPAL-${{ parameters.osVersion }}-$(CC)-$(BUILD_TYPE)'
  displayName: 'Publish Build Artifacts'
