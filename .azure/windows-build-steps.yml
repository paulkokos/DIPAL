# Template for Windows MSVC build steps
parameters:
- name: osVersion
  type: string

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'
    addToPath: true
  displayName: 'Use Python 3.11'

- script: |
    choco install ninja -y
    ninja --version
  displayName: 'Install Ninja'

- script: |
    if exist .gitmodules (
      git submodule update --init --recursive
    )
  displayName: 'Initialize Git Submodules'

- task: VSBuild@1
  inputs:
    solution: ''
  displayName: 'Setup Visual Studio Environment'
  enabled: false

- script: |
    call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
    mkdir build
    cd build
    cmake -G "Ninja" ^
      -DCMAKE_BUILD_TYPE=$(BUILD_TYPE) ^
      -DCMAKE_CXX_STANDARD=23 ^
      -DBUILD_TESTS=$(BUILD_TESTS) ^
      -DBUILD_EXAMPLES=$(BUILD_EXAMPLES) ^
      -DENABLE_SANITIZERS=OFF ^
      -DCMAKE_INSTALL_PREFIX=$(Build.ArtifactStagingDirectory) ^
      ..
  displayName: 'Configure CMake'

- script: |
    call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
    cd build
    cmake --build . --parallel
  displayName: 'Build Project'

- script: |
    call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
    cd build
    ctest --output-on-failure -C $(BUILD_TYPE)
  displayName: 'Run Tests'
  condition: eq(variables['BUILD_TESTS'], 'ON')

- script: |
    call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
    cd build
    cmake --install . --config $(BUILD_TYPE)
  displayName: 'Install Project'

- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'CTest'
    testResultsFiles: 'build/Testing/**/Test.xml'
    testRunTitle: 'CTest Results - ${{ parameters.osVersion }} - MSVC $(BUILD_TYPE)'
  displayName: 'Publish Test Results'
  condition: eq(variables['BUILD_TESTS'], 'ON')

- task: PublishBuildArtifacts@1
  inputs:
    pathtoPublish: '$(Build.ArtifactStagingDirectory)'
    artifactName: 'DIPAL-${{ parameters.osVersion }}-MSVC-$(BUILD_TYPE)'
  displayName: 'Publish Build Artifacts'
